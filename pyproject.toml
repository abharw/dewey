[project]
name = "dewey"
version = "0.1.0"
description = "A personal learning skill for AI agents, with model evals built on Pydantic Evals"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[openai]", "pydantic-evals"]

[project.scripts]
dewey = "dewey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

